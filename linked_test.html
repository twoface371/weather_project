<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨~</title>
    <link rel="stylesheet" href="./weather_front.css">
</head>
<body>
    <div id="title_border">
        <h1 id="title">성훈이와 병규의 날씨 알리미~~!</h1>
    </div>

    <button id="togglebtn">지도 보기</button>

    <div id="mapwrapper"> 
        <div id="map" ></div>
        <p id="result"></p>
    </div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4a9fae61467eace2e8b25888ca904459"></script>

    <div id="content_row">
        <div id="tmpnscore">
            <h2 id="tns_title">오늘의 날씨 점수!</h2>
            <div id="tns_div">
                <p id="score">지도에서 위치를 선택해 주세요!</p>
            </div>
        </div>

        <div id="total_box">
            <h2 id="total_title">오늘의 옷차림 추천</h2>
            <div id="total_article">
                <p id="cloth"></p>
            </div>
        </div>
    </div>

    <div id="table_grid">
        <div class="cell" id="main">날씨상태</div>
        <div class="cell" id="temp">현재기온</div>
        <div class="cell" id="feels_like">체감온도</div>
        <div class="cell" id="temp_min">최저기온</div>
        <div class="cell" id="temp_max">최대기온</div>
        <div class="cell" id="humidity">습도</div>
        <div class="cell" id="wind_degree">풍향</div>
        <div class="cell" id="wind_speed">풍속</div>
        <div class="cell" id="pm10value">미세먼지</div>
        <div class="cell" id="pm25value">초미세먼지</div>
        <div class="cell" id="o3grade">오존</div>

    </div>

    <script src="./linked_test.js"></script>
</body>
</html>
